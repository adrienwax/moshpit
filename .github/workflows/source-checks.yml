name: Windows source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      KRAB_SCRATCH_ROOT: ${{ runner.temp }}\moshpit-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies without native install scripts
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Check colour tokens
        run: npm run lint:colours
      - name: Release regressions
        run: npm run test:release
      - name: Authored example and manifest checks
        run: node --test scripts/examples/checks.test.mjs
